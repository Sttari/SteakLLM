# kube-linter: the defaults plus the checks a reviewer asks about. Argo CD Application manifests
# are not workloads and are ignored by every check; values files are not manifests.
checks:
  addAllBuiltIn: false
  include:
    - default-service-account
    - drop-net-raw-capability
    - env-var-secret
    - latest-tag
    - no-read-only-root-fs
    - non-existent-service-account
    - privilege-escalation-container
    - privileged-container
    - run-as-non-root
    - unset-cpu-requirements
    - unset-memory-requirements
    - no-liveness-probe
    - no-readiness-probe
    - dangling-service
    - mismatching-selector
