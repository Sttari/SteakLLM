# The NVIDIA device plugin: on every GPU-pool node it talks to the driver and tells the kubelet
# "this node has nvidia.com/gpu: 1", which is the resource vLLM's pod asks for. It needs the kubelet's
# device-plugin socket directory (a hostPath) and runs as root, so it lives in kube-system, the room
# without a pod-security label. It tolerates the pool's taint and goes nowhere else.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "registers a socket in the kubelet's device-plugins directory"
    ignore-check.kube-linter.io/default-service-account: "talks to the kubelet's socket only; no API access"
    ignore-check.kube-linter.io/no-liveness-probe: "the plugin exits on driver errors and the DaemonSet restarts it"
    ignore-check.kube-linter.io/no-readiness-probe: "serves no traffic"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-device-plugin
    spec:
      nodeSelector:
        steakllm.io/pool: gpu
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      priorityClassName: system-node-critical
      automountServiceAccountToken: false
      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.20.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: device-plugin, mountPath: /var/lib/kubelet/device-plugins }
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
