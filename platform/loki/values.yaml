# Loki 3.x (chart 7.3.0) in single-binary mode: one pod, one disk, no object store. S3 as the store is
# Step 10's backup decision; until then the log history dies with the cluster like every other volume.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h # 7 days
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 20Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  nodeSelector:
    steakllm.io/pool: cpu

# The scalable-mode components are off; the chart needs them told so explicitly.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway: { replicas: 0 }

# Memory savers on a one-node cluster: no caches, no canary, no test pod, no nginx gateway
# (Grafana and Alloy talk to the `loki` Service on 3100 directly).
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
gateway: { enabled: false }
minio: { enabled: false }

monitoring:
  serviceMonitor:
    enabled: true # Prometheus scrapes Loki
