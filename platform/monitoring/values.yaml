# kube-prometheus-stack 88.6.4 on one t4g.xlarge. Requests are the memory table's numbers (field notes §2).

# ---- what is scraped ---------------------------------------------------------------------------------
# Everything the chart knows (node, kubelet, apiserver, CoreDNS, kube-state-metrics) plus every
# ServiceMonitor/PodMonitor in any namespace — Argo, Strimzi, Qdrant and the workers register theirs.
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    retentionSize: 18GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          resources:
            requests:
              storage: 20Gi
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { cpu: "1", memory: 1536Mi }
    nodeSelector:
      steakllm.io/pool: cpu

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }
    nodeSelector:
      steakllm.io/pool: cpu
  # the Alertmanager service account wears Pod Identity monitoring/kube-prometheus-stack-alertmanager →
  # sns:Publish on the notifications topic (infra/platform, 11.5); every alert links a runbook.
  config:
    route:
      receiver: sns-email
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: [alertname = "Watchdog"] # the chart's heartbeat: never page on it
    receivers:
      - name: "null"
      - name: sns-email
        sns_configs:
          - topic_arn: arn:aws:sns:us-east-1:066591056087:steakllm-notifications
            sigv4:
              region: us-east-1
            subject: '[SteakLLM] {{ .CommonLabels.alertname }} ({{ .Status }})'
            message: |
              {{ range .Alerts }}{{ .Labels.alertname }} — {{ .Annotations.summary }}
              runbook: {{ .Annotations.runbook_url }}
              {{ end }}

# ---- Grafana ----------------------------------------------------------------------------------------
grafana:
  admin:
    existingSecret: grafana-admin # from Secrets Manager via External Secrets (steakllm/grafana)
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP # never an Ingress here; the tailnet proxy below is the only way in
    annotations:
      tailscale.com/expose: "true"
      tailscale.com/hostname: grafana
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  nodeSelector:
    steakllm.io/pool: cpu
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL # any ConfigMap labelled grafana_dashboard=1 becomes a dashboard (platform/monitoring/dashboards)
    datasources:
      enabled: true
  # Dashboards from grafana.com by id, downloaded by the sidecar (egress via the NAT): Argo CD (14584),
  # Strimzi Kafka (11962), Loki (13407). Provisioned read-only under the "platform" folder.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: platform
          orgId: 1
          folder: platform
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/platform
  dashboards:
    platform:
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus
      kafka:
        gnetId: 11962
        revision: 1
        datasource: Prometheus
      loki:
        gnetId: 13407
        revision: 1
        datasource: Prometheus
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.logging.svc:3200 # Tempo's HTTP API; 3100 is Loki's
      access: proxy
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
    - name: CloudWatch
      type: cloudwatch
      uid: cloudwatch
      access: proxy
      jsonData:
        authType: default # the pod's Pod Identity role (infra/platform): cloudwatch:GetMetricData
        defaultRegion: us-east-1
    - name: Loki
      type: loki
      uid: loki
      jsonData:
        derivedFields:
          - name: trace
            matcherRegex: '"trace_id": "([a-f0-9]+)"'
            url: '$${__value.raw}'
            datasourceUid: tempo
      url: http://loki.logging.svc:3100
      access: proxy
      isDefault: false

# ---- exporters ---------------------------------------------------------------------------------------
prometheus-node-exporter:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }
kube-state-metrics:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
  nodeSelector:
    steakllm.io/pool: cpu
prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 200m, memory: 256Mi }
  nodeSelector:
    steakllm.io/pool: cpu
  admissionWebhooks:
    patch:
      nodeSelector:
        steakllm.io/pool: cpu

# EKS hides the control plane; these scrape targets would only ever be down.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
