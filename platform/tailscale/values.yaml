# Tailscale operator (chart tailscale-operator 1.102.3). The OAuth client is mounted from the Secret
# operator-oauth (keys client_id, client_secret), synced from Secrets Manager — never from values.
oauthSecretVolume:
  secret:
    secretName: operator-oauth
operatorConfig:
  hostname: steakllm-k8s-operator
  nodeSelector:
    steakllm.io/pool: cpu
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
proxyConfig:
  defaultTags: tag:k8s
  defaultProxyClass: cpu # platform/tailscale-config/proxyclass.yaml
