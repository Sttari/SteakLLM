# The rooms. Labels are what NetworkPolicies (8.10) select on; pod-security is the restricted profile
# by default and relaxed only where a component needs it (Kafka, the log collector).
apiVersion: v1
kind: Namespace
metadata:
  name: steakllm
  labels:
    steakllm.io/tier: services
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    steakllm.io/tier: platform
    # node-exporter mounts the node's /proc, /sys and / read-only and uses the host network: that is
    # `privileged` territory under Pod Security (baseline forbids hostPath). Enforce privileged, warn
    # at baseline so anything *else* in this room that oversteps is at least noticed (Incident 28).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    steakllm.io/tier: platform
    # Alloy tails /var/log/pods on the node through a hostPath mount (baseline forbids it) — Incident 28.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    steakllm.io/tier: data
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: qdrant
  labels:
    steakllm.io/tier: data
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  labels:
    steakllm.io/tier: data
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
  labels:
    steakllm.io/tier: ui
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    steakllm.io/tier: platform
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    steakllm.io/tier: platform
    # The proxies add NET_ADMIN for WireGuard, which baseline refuses (only privileged admits added
    # capabilities of that kind) — Incident 31b. Warn/audit at baseline so anything else is noticed.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
