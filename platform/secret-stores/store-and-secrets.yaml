# One store for the whole cluster: Secrets Manager in us-east-1, authenticated by the operator's own
# Pod Identity credentials (no auth block = the AWS default credential chain, which the Pod Identity
# agent serves). Reading is limited by the role to steakllm/* (infra/platform).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
# steakllm/grafana → monitoring/grafana-admin: keys admin-user and admin-password, refreshed hourly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: steakllm/grafana
---
# steakllm/gateway → steakllm/gateway-keys: api_key and demo_key (the gateway chart, 8.8, mounts them as env).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-keys
  namespace: steakllm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: gateway-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: steakllm/gateway
---
# The same gateway keys, for Open WebUI's namespace (it logs into the gateway with api_key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-keys
  namespace: open-webui
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: gateway-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: steakllm/gateway
---
# steakllm/tailscale → tailscale/operator-oauth: client_id and client_secret for the operator (8.9).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: operator-oauth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: steakllm/tailscale
---
# steakllm/argocd → the bcrypt hash of the admin password, merged into Argo's own argocd-secret (8.9).
# Argo reads admin.password (bcrypt) and admin.passwordMtime from that secret; the plain password lives
# only in Secrets Manager. The chart-created argocd-initial-admin-secret is then stale and can go.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: argocd-secret
    creationPolicy: Merge # never take ownership of argocd-secret; add two keys to it
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        admin.password: "{{ .password | bcrypt }}" # gitleaks:allow — a template, not a value; the value is in Secrets Manager
        admin.passwordMtime: "2026-09-04T00:00:00Z"
  data:
    - secretKey: password
      remoteRef:
        key: steakllm/argocd # gitleaks:allow — the slot's name, not a value
        property: password
