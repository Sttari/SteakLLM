# Grafana Alloy (chart 1.12.1) as a DaemonSet shipping pod logs to Loki. The pipeline below is Alloy's
# configuration language: discover pods on this node → tail their log files → label → push.
controller:
  type: daemonset
  nodeSelector:
    steakllm.io/pool: cpu

alloy:
  mounts:
    varlog: true # /var/log/pods on the node
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  configMap:
    create: true
    content: |
      // Pods on this node only.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME_NODE")
        }
      }

      // Keep the labels a query needs and drop the rest.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.logging.svc:3100/loki/api/v1/push"
        }
      }

  extraEnv:
    - name: HOSTNAME_NODE
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
