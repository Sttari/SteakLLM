# Grafana Alloy as the log collector: a DaemonSet that tails every container's stdout on the node and
# ships it to Loki with namespace/pod/container labels. Wave 3: after Loki.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        releaseName: alloy
        valueFiles:
          - $values/platform/alloy/values.yaml
    - repoURL: https://github.com/Sttari/SteakLLM.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
