# The ClusterSecretStore (how to reach Secrets Manager) and the ExternalSecrets that copy each slot
# into the namespace that needs it. Wave 1: the CRDs from the operator must exist first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Sttari/SteakLLM.git
    targetRevision: main
    path: platform/secret-stores
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10 # the CRDs may still be registering on a fresh cluster
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
