# Ollama serving all-minilm (384-dim) behind /v1/embeddings, as on the laptop (ADR-0009). Plain
# manifests: a Deployment, a 10 Gi gp3 volume that caches the model, a Service, and a post-sync Job that
# pulls the model once. Wave 3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/Sttari/SteakLLM.git
    targetRevision: main
    path: platform/ollama
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
