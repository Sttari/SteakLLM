# The operator's configuration objects (its CRDs must exist first — wave 3, with retries): a ProxyClass
# that keeps every proxy pod on the CPU node, and a Connector that advertises the VPC's range to the
# tailnet so kubectl reaches the cluster's private endpoint from the laptop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/Sttari/SteakLLM.git
    targetRevision: main
    path: platform/tailscale-config
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
