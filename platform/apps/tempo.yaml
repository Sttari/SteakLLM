# Tempo: the traces store (ADR-0013), single-binary beside Loki in the logging room. Services and the
# Lambda send OTLP/HTTP to tempo.logging.svc:4318; Grafana reads it and links log lines to traces. Wave 3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4
      helm:
        releaseName: tempo
        valueFiles:
          - $values/platform/tempo/values.yaml
    - repoURL: https://github.com/Sttari/SteakLLM.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
