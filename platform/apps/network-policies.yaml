# The museum's interior doors: default-deny in every application namespace, then explicit allows.
# Wave 5: after everything that must keep working is up, so a wrong rule shows as a broken thing,
# not as a thing that never started.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # right after the rooms (-2), before anything moves in: on a rebuild the walls were the last thing up because a wave-4 Job was slow (Incident 43)
spec:
  project: default
  source:
    repoURL: https://github.com/Sttari/SteakLLM.git
    targetRevision: main
    path: platform/network-policies
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
