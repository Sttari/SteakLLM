# kube-prometheus-stack: Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics and the
# default rules, as one chart. Grafana's admin login comes from Secrets Manager through the
# grafana-admin ExternalSecret (secret-stores). Wave 2: after storage and secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.6.4
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/platform/monitoring/values.yaml
    - repoURL: https://github.com/Sttari/SteakLLM.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # the Prometheus CRDs are far beyond the client-side annotation limit
  ignoreDifferences:
    # the admission webhook's CA bundle is patched at runtime by the chart's own job
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers: [/webhooks/0/clientConfig/caBundle]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers: [/webhooks/0/clientConfig/caBundle]
