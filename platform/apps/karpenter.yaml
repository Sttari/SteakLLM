# Karpenter: the just-in-time node maker (ADR-0011). It watches for pods nobody can schedule, launches the
# one machine their NodePool allows, and removes it when it has been empty for consolidateAfter. It runs
# on the CPU node, wears the steakllm/karpenter Pod Identity role (infra/gpu) and listens on the
# interruption queue. Wave 3: before the gpu-pool rules that need its CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: public.ecr.aws/karpenter
      chart: karpenter
      targetRevision: 1.14.1
      helm:
        releaseName: karpenter
        valueFiles:
          - $values/platform/karpenter/values.yaml
    - repoURL: https://github.com/Sttari/SteakLLM.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # the NodePool/EC2NodeClass CRDs are too large for the last-applied annotation
