# Qwen2.5-7B-Instruct → s3://steakllm-models-066591056087/qwen2.5-7b-instruct/ (15.2 GB, once).
# One container: if the bucket already has the model's config.json, exit; otherwise download the
# safetensors and tokenizer files from Hugging Face into a scratch volume on the node's disk, then
# upload them with boto3's multipart transfer over the S3 gateway endpoint.
# (s5cmd v2.3.0 was the first draft: its vendored Go SDK rejects Pod Identity's credential endpoint
# 169.254.170.23 — "only loopback hosts are allowed" — while boto3 in the same pod had no trouble; Incident 35e.)
apiVersion: batch/v1
kind: Job
metadata:
  name: mirror-weights
  namespace: steakllm
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true # a Job is immutable and carries a generated selector: only delete-then-create works (Incident 35b)
    ignore-check.kube-linter.io/no-liveness-probe: "one-shot job"
    ignore-check.kube-linter.io/no-readiness-probe: "one-shot job"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800 # a week; Argo then re-creates it and the guard makes it a no-op
  template:
    metadata:
      labels:
        steakllm.io/role: mirror
    spec:
      serviceAccountName: mirror
      automountServiceAccountToken: false
      restartPolicy: Never # a pod restarted in place is deleted at the back-off limit, logs and scratch with it (Incident 35d); Never keeps the failed pod as evidence
      nodeSelector:
        steakllm.io/pool: cpu
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mirror
          image: public.ecr.aws/docker/library/python:3.12-slim
          env:
            - { name: MODEL, value: Qwen/Qwen2.5-7B-Instruct }
            - { name: BUCKET, value: steakllm-models-066591056087 }
            - { name: PREFIX, value: qwen2.5-7b-instruct/ }
            - { name: HF_HUB_ENABLE_HF_TRANSFER, value: "0" }
            - { name: HOME, value: /work }
            - { name: PIP_NO_CACHE_DIR, value: "1" }
          command:
            - sh
            - -c
            - |
              set -e
              pip install --quiet --target /work/py "huggingface_hub>=0.30" boto3
              export PYTHONPATH=/work/py
              python - <<'PY'
              import os, sys, boto3
              from boto3.s3.transfer import TransferConfig
              from botocore.exceptions import ClientError  # not s3.exceptions.ClientError: that attribute does not exist (Incident 35)
              from huggingface_hub import snapshot_download
              bucket, prefix = os.environ["BUCKET"], os.environ["PREFIX"]
              s3 = boto3.client("s3")
              try:
                  s3.head_object(Bucket=bucket, Key=prefix + "config.json")
                  print("guard: weights already in the bucket; nothing to do"); sys.exit(0)
              except ClientError as e:
                  if e.response["Error"]["Code"] not in ("404", "NoSuchKey", "NotFound"):
                      raise
              path = snapshot_download(os.environ["MODEL"], local_dir="/work/model", max_workers=2,
                                       allow_patterns=["*.safetensors", "*.json", "*.txt", "merges.txt", "vocab.json"])
              files = sorted(os.path.join(d, f) for d, _, fs in os.walk(path) for f in fs if "/.cache" not in d)
              total = sum(os.path.getsize(f) for f in files)
              print(f"downloaded {total/1e9:.1f} GB in {len(files)} files to {path}", flush=True)
              cfg = TransferConfig(multipart_threshold=64 << 20, multipart_chunksize=64 << 20, max_concurrency=8)
              for f in files:
                  key = prefix + os.path.relpath(f, path)
                  s3.upload_file(f, bucket, key, Config=cfg)
                  print(f"uploaded {os.path.getsize(f)/1e9:6.2f} GB  s3://{bucket}/{key}", flush=True)
              n = size = 0
              for page in s3.get_paginator("list_objects_v2").paginate(Bucket=bucket, Prefix=prefix):
                  for o in page.get("Contents", []):
                      n += 1; size += o["Size"]
              print(f"bucket now holds {n} objects, {size/1e9:.1f} GB under {prefix}")
              PY
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "2", memory: 6Gi } # four 4 GB shards in flight OOM-killed at 2Gi (Incident 35c); the node has 16 GiB
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # pip writes under /work (PIP target, HOME) and /tmp
            capabilities: { drop: [ALL] }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: work
          emptyDir:
            sizeLimit: 24Gi # on the node's 40 GB root disk, for the duration of the Job
