# Strimzi 1.x serves the kafka.strimzi.io/v1 API only (v1beta2 is gone; Incident 29), and is KRaft-only,
# so the kraft/node-pools annotations are no longer needed.
# One KRaft node that is both controller and broker (a "combined" node pool), 20 Gi gp3, a 1 GiB heap.
# The same settings as compose/: plain internal listener on 9092, no topic auto-creation, replication 1.
# Bootstrap address for the services: steakllm-kafka-bootstrap.kafka.svc:9092
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  namespace: kafka
  labels:
    strimzi.io/cluster: steakllm
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        class: gp3
        deleteClaim: true # the log dies with the cluster (dev-time posture); Step 10 replays from S3
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    limits: { cpu: "1", memory: 2Gi }
  jvmOptions:
    -Xms: 512m
    -Xmx: 1024m
  template:
    pod:
      metadata:
        labels:
          steakllm.io/component: kafka
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: steakllm
  namespace: kafka
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false # inside the cluster, behind NetworkPolicies (8.10); TLS between pods is a Step 10 hardening item
        # Strimzi generates a NetworkPolicy for each listener that admits everyone unless told whom;
        # policies are additive, so that generated policy would undo platform/network-policies (8.10).
        networkPolicyPeers:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: steakllm
          - podSelector: {} # this namespace: the operator, the entity operator, the broker itself
      # The Lambda's door (ADR-0012, 10.3): an internal NLB built by the AWS Load Balancer Controller, in the
      # security group steakllm-kafka-door (infra/pipeline), which admits only the ingest Lambda's group. TLS
      # with the cluster CA (the Lambda verifies the broker; the door is not on the tailnet). The NLB keeps the
      # client's address (target type ip), so the generated NetworkPolicy admits the private subnets.
      - name: lambda
        port: 9094
        type: loadbalancer
        tls: true
        configuration:
          bootstrap:
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: external
              service.beta.kubernetes.io/aws-load-balancer-scheme: internal
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
              service.beta.kubernetes.io/aws-load-balancer-security-groups: steakllm-kafka-door
              service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"
          brokers:
            - broker: 0
              annotations:
                service.beta.kubernetes.io/aws-load-balancer-type: external
                service.beta.kubernetes.io/aws-load-balancer-scheme: internal
                service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                service.beta.kubernetes.io/aws-load-balancer-security-groups: steakllm-kafka-door
                service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"
        networkPolicyPeers:
          - ipBlock:
              cidr: 10.42.192.0/18
          - ipBlock:
              cidr: 10.42.128.0/18
    config:
      auto.create.topics.enable: false
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      log.retention.hours: 168
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
    template:
      pod:
        metadata:
          labels:
            steakllm.io/component: kafka
  entityOperator:
    topicOperator:
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { cpu: 300m, memory: 256Mi }
    # no userOperator: no Kafka users until TLS/SASL (Step 10)
---
# Prometheus scrapes the broker's JMX metrics through this PodMonitor (kube-prometheus-stack picks
# up every PodMonitor).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka
  namespace: kafka
  labels:
    app: strimzi
spec:
  selector:
    matchLabels:
      strimzi.io/kind: Kafka
  namespaceSelector:
    matchNames: [kafka]
  podMetricsEndpoints:
    - path: /metrics
      port: tcp-prometheus
