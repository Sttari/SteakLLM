# Strimzi 1.x serves the kafka.strimzi.io/v1 API only (v1beta2 is gone; Incident 29), and is KRaft-only,
# so the kraft/node-pools annotations are no longer needed.
# One KRaft node that is both controller and broker (a "combined" node pool), 20 Gi gp3, a 1 GiB heap.
# The same settings as compose/: plain internal listener on 9092, no topic auto-creation, replication 1.
# Bootstrap address for the services: steakllm-kafka-bootstrap.kafka.svc:9092
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  namespace: kafka
  labels:
    strimzi.io/cluster: steakllm
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        class: gp3
        deleteClaim: true # the log dies with the cluster (dev-time posture); Step 10 replays from S3
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    limits: { cpu: "1", memory: 2Gi }
  jvmOptions:
    -Xms: 512m
    -Xmx: 1024m
  template:
    pod:
      metadata:
        labels:
          steakllm.io/component: kafka
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: steakllm
  namespace: kafka
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false # inside the cluster, behind NetworkPolicies (8.10); TLS between pods is a Step 10 hardening item
    config:
      auto.create.topics.enable: false
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      log.retention.hours: 168
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
    template:
      pod:
        metadata:
          labels:
            steakllm.io/component: kafka
  entityOperator:
    topicOperator:
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { cpu: 300m, memory: 256Mi }
    # no userOperator: no Kafka users until TLS/SASL (Step 10)
---
# Prometheus scrapes the broker's JMX metrics through this PodMonitor (kube-prometheus-stack picks
# up every PodMonitor).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka
  namespace: kafka
  labels:
    app: strimzi
spec:
  selector:
    matchLabels:
      strimzi.io/kind: Kafka
  namespaceSelector:
    matchNames: [kafka]
  podMetricsEndpoints:
    - path: /metrics
      port: tcp-prometheus
