# KEDA 2.20.2: three small pods (operator, metrics API server, admission webhooks) on the CPU node. The
# chart's defaults already run non-root, read-only, no capabilities, seccomp RuntimeDefault, which is what
# the restricted keda room enforces. Certificates are self-generated by the operator.
nodeSelector:
  steakllm.io/pool: cpu
resources:
  operator:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  metricServer:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  webhooks:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }
