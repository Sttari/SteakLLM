# steakllm-embedder — consumes DocumentUploaded: fetch · verify · chunk · embed · upsert; DocumentDeleted: drop points.
[project]
name = "steakllm-embedder"
version = "0.1.0"
description = "SteakLLM embedder: documents → chunks → vectors in Qdrant, idempotently"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "steakllm-contracts",
  "steakllm-common",
]

[project.scripts]
steakllm-embedder = "steakllm_embedder.main:cli"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.16",
]

[tool.uv.sources]
steakllm-contracts = { path = "../contracts", editable = true }
steakllm-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steakllm_embedder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs the local stack (make up)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "N"]
