# steakllm-common — what the five services share: settings, JSON logging, the Kafka consumer loop,
# client factories, and the probe server. The policies are written in services/README.md; this is their code.
[project]
name = "steakllm-common"
version = "0.1.0"
description = "SteakLLM shared library: settings, JSON logs, Kafka consumer loop with retry/DLQ, clients, probes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "steakllm-contracts",
  "pydantic-settings>=2.6",
  "kafka-python>=2.2",
  "boto3>=1.35",
  "qdrant-client>=1.12",
  "httpx>=0.27",
  "pypdf>=5",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.16",
  "moto[s3,dynamodb]>=5.0",
]

[tool.uv.sources]
steakllm-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steakllm_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs the local stack (make up)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "N"]
