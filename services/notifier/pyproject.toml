# steakllm-notifier — consumes SummaryReady: watch-list match → one notification per event, never twice.
[project]
name = "steakllm-notifier"
version = "0.1.0"
description = "SteakLLM notifier: SummaryReady × watch-list → stdout locally, SNS in the cloud"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "steakllm-contracts",
  "steakllm-common",
]

[project.scripts]
steakllm-notifier = "steakllm_notifier.main:cli"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.16",
  "moto[dynamodb,sns]>=5.0",
]

[tool.uv.sources]
steakllm-contracts = { path = "../contracts", editable = true }
steakllm-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steakllm_notifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs the local stack (make up)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "N"]
