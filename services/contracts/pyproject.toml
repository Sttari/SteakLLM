# steakllm-contracts — the event envelope, five event schemas, and the idempotency rules.
# The first Python package in the project; every service in Step 6 copies this shape.
[project]
name = "steakllm-contracts"
version = "1.0.0"
description = "SteakLLM event contracts: envelope, DocumentUploaded/Indexed, SummaryReady, DocumentDeleted, ChatCompleted; doc_id and point_id rules"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",   # validates JSON documents against JSON Schema (draft 2020-12)
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Schemas and examples ship inside the wheel so importing services get them (importlib.resources).
[tool.hatch.build.targets.wheel]
packages = ["src/steakllm_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle · I: import order · B: bugbear · UP: modern syntax · BLE: no blind except · N: naming
select = ["E", "F", "I", "B", "UP", "BLE", "N"]
