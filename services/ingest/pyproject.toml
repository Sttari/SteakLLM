# steakllm-ingest — the S3 doorbell: validate · hash · record · produce. Lambda handler plus a local runner.
[project]
name = "steakllm-ingest"
version = "0.1.0"
description = "SteakLLM ingest: S3 ObjectCreated/ObjectRemoved → DocumentUploaded/DocumentDeleted"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "steakllm-contracts",
  "steakllm-common",
]

[project.scripts]
steakllm-ingest = "steakllm_ingest.main:cli"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.16",
  "moto[s3,dynamodb]>=5.0",
]

[tool.uv.sources]
steakllm-contracts = { path = "../contracts", editable = true }
steakllm-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steakllm_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs the local stack (make up)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "N"]
