# steakllm-summarizer — consumes DocumentUploaded: text → gateway (llm) → summary + tags → catalog → SummaryReady.
[project]
name = "steakllm-summarizer"
version = "0.1.0"
description = "SteakLLM summarizer: asks the gateway for a summary and tags, writes them to the catalog"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "steakllm-contracts",
  "steakllm-common",
  "httpx>=0.27",
]

[project.scripts]
steakllm-summarizer = "steakllm_summarizer.main:cli"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.16",
]

[tool.uv.sources]
steakllm-contracts = { path = "../contracts" }
steakllm-common = { path = "../common" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steakllm_summarizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs the local stack (make up)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "N"]
