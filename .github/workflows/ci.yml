# ci.yml — "is this commit healthy?"  Five parallel jobs, one concern each.
# Job names are load-bearing: branch protection (3.3) requires them by name.
name: ci

on:
  push:
    branches: [main]   # pushes to main (i.e. merges)
  pull_request:        # every PR, any branch

permissions:
  contents: read       # checkout; the e2e job also needs an OIDC token for Bedrock
  pull-requests: read  # gitleaks-action lists the PR's commits to scan exactly what the PR adds
  id-token: write      # e2e: assume the plan role (Bedrock InvokeModel only, beyond read)

concurrency:
  group: ci-${{ github.ref }}   # a new push to the same branch cancels the old run
  cancel-in-progress: true

jobs:
  # Full-history secret scan. The laptop hook checks staged files; this checks everything,
  # including commits pushed from a machine with no hooks installed.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                    # full history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # auto-minted per run; not a stored secret

  # Dockerfile and Compose misconfigurations (a root user, a missing HEALTHCHECK, a floating base tag…):
  # Trivy's config scanner, the same tool release.yml points at the built images.
  trivy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: services
          severity: HIGH,CRITICAL
          exit-code: "1"

  # Formatting and internal consistency of every Terraform module.
  # -backend=false: validate without touching S3 state, so no AWS credentials needed.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"       # match the laptop; Dependabot bumps it
      - run: terraform fmt -check -recursive infra
      - name: validate each module
        run: |
          for dir in infra/*/; do
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null
            terraform -chdir="$dir" validate -no-color
          done

  # Rules the compiler doesn't have: deprecated syntax, impossible instance types…
  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive --format compact

  # Static security scan of the Terraform: public buckets, open security groups,
  # missing encryption — caught as text, before anything exists.
  checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true                       # report failures only

  # Python lint + format check (today: the guard hook; later: the five services).
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3      # runs `ruff check .`
      - run: ruff format --check .

  # Every Python package under services/ (found by its pyproject.toml): install from the lockfile, run its tests.
  # --frozen fails if uv.lock is out of date, so a forgotten lock update can't slip through.
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true                # keyed on uv.lock
      - name: test each package
        run: |
          found=0
          for dir in services/*/; do
            [ -f "$dir/pyproject.toml" ] || continue
            found=1
            echo "== $dir"
            uv sync --directory "$dir" --frozen
            uv run --directory "$dir" pytest
          done
          [ "$found" = 1 ] || { echo "no Python packages found under services/"; exit 1; }

  # The step's promise, on a runner: boot the stack, drop a file, expect searchable + summarized
  # within 60 s. Skips itself (reporting success) when nothing that could affect it changed.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            stack:
              - 'services/**'
              - 'compose/**'
              - 'tests/e2e/**'
              - 'Makefile'
              - '.env.example'
              - '.github/workflows/ci.yml'
      - if: steps.changed.outputs.stack == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - if: steps.changed.outputs.stack == 'true'
        name: Assume the plan role (OIDC) for Bedrock
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          output-env-credentials: true
      - if: steps.changed.outputs.stack == 'true'
        name: Boot the stack (no UI, no notifier) and run the e2e test
        env:
          E2E_BUDGET_SECONDS: "120" # runners are slower than the laptop; the local budget stays 60
        run: |
          grep -vE '^AWS_PROFILE=' .env.example > .env          # runner credentials come from the env
          make build
          make up INFRA="minio dynamodb qdrant kafka ollama vllm-stub"
          make e2e
      - if: failure() && steps.changed.outputs.stack == 'true'
        name: Stack state on failure
        run: |
          make ps || true
          docker compose --env-file .env --profile services -f compose/compose.yaml logs --no-log-prefix --tail 60 gateway ingest embedder summarizer || true
      - if: always() && steps.changed.outputs.stack == 'true'
        run: make down
