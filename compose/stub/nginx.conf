# The "vLLM is down" stub. It exists to be unhealthy: the gateway's routing policy (health check →
# Bedrock fallback → circuit breaker) must be exercised locally, and the Mac has no GPU to run the
# real thing. Every route a gateway would call answers 503, the shape of a GPU node that isn't there.
server {
    listen 8081;
    default_type application/json;

    location = /health {
        return 503 '{"status":"down","reason":"vllm stub: the GPU node does not exist on this laptop"}';
    }
    location /v1/ {
        return 503 '{"error":{"message":"vllm stub: backend unavailable","type":"server_error","code":503}}';
    }
    location / {
        return 404 '{"error":"not found"}';
    }
}
