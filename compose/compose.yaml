# The local dev stack: protocol-faithful stand-ins for the cloud (Step 5). Run via `make up`, which
# passes `--env-file .env` from the repo root so one .env serves Compose and the services alike.
# Every long-running service has a healthcheck; init containers run once after their dependency is
# healthy and exit 0. Images are pinned by exact tag (pin, then distrust the pin — Dependabot watches).
name: ${COMPOSE_PROJECT_NAME:-steakllm}

services:
  # ---- S3 stand-in: same API, only the endpoint differs -------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: create the documents bucket (idempotent), then exit 0.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$DOCUMENTS_BUCKET" &&
        echo "bucket ready: $DOCUMENTS_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET}

  # ---- DynamoDB stand-in: Amazon's own local build --------------------------------------------
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    # -sharedDb: one database file regardless of credentials; -dbPath: persist in the volume.
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    # The image runs as user `dynamodblocal`, but Docker creates named volumes root-owned, so SQLite
    # cannot open its file and every request hangs (Incident 14). Root is acceptable for a laptop stand-in.
    user: root
    ports:
      - "8001:8000" # 8001 on the Mac: 8000 belongs to the gateway (Incident 20)
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      # a real API call must answer within 2s: an HTTP 400 from the JSON layer is not proof the engine works (Incident 14)
      test: ["CMD-SHELL", "curl -s -m 2 -X POST http://localhost:8000 -H 'Content-Type: application/x-amz-json-1.0' -H 'X-Amz-Target: DynamoDB_20120810.ListTables' -H 'Authorization: AWS4-HMAC-SHA256 Credential=local/20260101/us-east-1/dynamodb/aws4_request, SignedHeaders=host, Signature=x' -d '{}' | grep -q TableNames"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: create the catalog table (doc_id key, on-demand), idempotent, exit 0.
  dynamodb-init:
    image: amazon/aws-cli:2.36.37
    depends_on:
      dynamodb:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws dynamodb describe-table --table-name "$CATALOG_TABLE" >/dev/null 2>&1 ||
        aws dynamodb create-table --table-name "$CATALOG_TABLE" \
          --attribute-definitions AttributeName=doc_id,AttributeType=S \
          --key-schema AttributeName=doc_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST >/dev/null &&
        echo "table ready: $CATALOG_TABLE"
    environment:
      AWS_ENDPOINT_URL: http://dynamodb:8000
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: local # DynamoDB Local accepts any credentials
      AWS_SECRET_ACCESS_KEY: local
      CATALOG_TABLE: ${CATALOG_TABLE}

  # ---- Vector store: the real thing ---------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # the image has no curl; bash's /dev/tcp opens a socket and we read the HTTP status line
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---- Kafka: the logbook. One node is controller + broker (KRaft; no ZooKeeper), as Strimzi will run it.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two doors: PLAINTEXT for containers (kafka:19092), EXTERNAL for the Mac (localhost:9092).
      # Kafka tells clients where to reconnect, so each advertised address must be reachable from where that client lives.
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single node: every replication factor is 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are contracts, declared by kafka-init; nothing may create one as a side effect.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data # exists in the image owned by appuser, so the volume inherits it
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # a real metadata request to the broker, not a port probe (Incident 14)
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

  # One-shot: declare the four topics from the contracts (idempotent), then list them.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        t=/opt/kafka/bin/kafka-topics.sh; b=kafka:19092
        $$t --bootstrap-server $$b --create --if-not-exists --topic "$$TOPIC_DOCUMENTS"       --partitions 3 --replication-factor 1
        $$t --bootstrap-server $$b --create --if-not-exists --topic "$$TOPIC_DOCUMENTS_RETRY" --partitions 1 --replication-factor 1
        $$t --bootstrap-server $$b --create --if-not-exists --topic "$$TOPIC_DOCUMENTS_DLQ"   --partitions 1 --replication-factor 1
        $$t --bootstrap-server $$b --create --if-not-exists --topic "$$TOPIC_CHATS"           --partitions 3 --replication-factor 1
        echo "topics ready:"; $$t --bootstrap-server $$b --list
    environment:
      TOPIC_DOCUMENTS: ${TOPIC_DOCUMENTS}
      TOPIC_DOCUMENTS_RETRY: ${TOPIC_DOCUMENTS_RETRY}
      TOPIC_DOCUMENTS_DLQ: ${TOPIC_DOCUMENTS_DLQ}
      TOPIC_CHATS: ${TOPIC_CHATS}

  # ---- Embeddings: Ollama behind the OpenAI-compatible /v1/embeddings contract (ADR-0005) --------
  # arm64-native on the laptop and on the Graviton node. Image is ~7 GB (bundles GPU runtimes we don't
  # use); revisit at Step 8 if pull time on the node hurts — the contract makes the server swappable.
  ollama:
    image: ollama/ollama:0.33.2
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama # weights survive `make down`
    environment:
      OLLAMA_KEEP_ALIVE: "-1" # keep the embedding model loaded; it is small
    healthcheck:
      # the CLI calls the server's API: a real request, not a port probe (Incident 14)
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: pull the embedding model through the server (into the shared volume), verify one embed.
  ollama-init:
    image: ollama/ollama:0.33.2
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        ollama pull "$$EMBEDDING_MODEL"
        echo "model ready: $$EMBEDDING_MODEL"
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}

  # ---- The "vLLM is down" stub: answers 503 so the gateway's fallback path is exercised locally ----
  vllm-stub:
    image: nginx:1.31.4-alpine
    ports:
      - "8081:8081"
    volumes:
      - ./stub/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # healthy means "reliably answering 503" — being down is its job. 127.0.0.1, not localhost:
      # inside the container localhost resolves to ::1 and nginx listens on IPv4 only (Incident 15).
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8081/health 2>&1 | grep -q ' 503 '"]
      interval: 5s
      timeout: 3s
      retries: 6

  # ---- Open WebUI: the chat front-end, talking ONLY to the gateway (as it will on the tailnet) -----
  # The gateway arrives in Step 6; until then the UI loads with no models, which is correct.
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3 # ~6.5 GB: bundles its own ML libraries
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      OPENAI_API_BASE_URL: ${OPEN_WEBUI_GATEWAY_URL}
      OPENAI_API_KEY: ${GATEWAY_API_KEY}
      ENABLE_OLLAMA_API: "false" # no side door to the embedding server; chat goes through the gateway
      ENABLE_OPENAI_API: "true"
      RESET_CONFIG_ON_START: "true" # dev only: Open WebUI persists connections from first boot; re-read the env
      WEBUI_AUTH: "false" # laptop only; in the cluster the tailnet is the door
      ENABLE_SIGNUP: "false"
      WEBUI_NAME: SteakLLM (local)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---- The five services (profile "services"): the same .env keys, container-network values --------
  # Build context is ../services so every Dockerfile sees contracts/ and common/.
  gateway:
    build: { context: ../services, dockerfile: gateway/Dockerfile }
    image: steakllm/gateway:local
    profiles: ["services"]
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    env_file: ../.env
    environment: &svc_env
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000 # presigned URLs are for the client on the Mac
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      KAFKA_BOOTSTRAP: kafka:19092
      QDRANT_URL: http://qdrant:6333
      EMBEDDINGS_URL: http://ollama:11434/v1
      VLLM_URL: http://vllm-stub:8081
      GATEWAY_URL: http://gateway:8000/v1
      # CI: the runner's OIDC credentials are passed through (there is no ~/.aws on a runner)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes: &aws_creds
      # AWS_PROFILE from the env file needs the profile to exist inside the container. Locally one
      # read-only profile serves all five; in the cluster each pod wears its own IAM role instead.
      - ~/.aws:/home/app/.aws:ro
    depends_on:
      kafka: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
      dynamodb: { condition: service_healthy }
    healthcheck: &svc_health_8000
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  ingest:
    build: { context: ../services, dockerfile: ingest/Dockerfile }
    image: steakllm/ingest:local
    profiles: ["services"]
    stop_grace_period: 30s # as Kubernetes: SIGTERM, 30 s to finish the record in hand, then SIGKILL
    volumes: *aws_creds
    command: ["steakllm-ingest", "watch"] # dev stand-in for S3 → EventBridge: polls quarantine/
    env_file: ../.env
    environment: *svc_env
    depends_on:
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      dynamodb: { condition: service_healthy }
    healthcheck: &svc_health_8080
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  embedder:
    build: { context: ../services, dockerfile: embedder/Dockerfile }
    image: steakllm/embedder:local
    profiles: ["services"]
    stop_grace_period: 30s
    volumes: *aws_creds
    env_file: ../.env
    environment: *svc_env
    depends_on:
      kafka: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      ollama: { condition: service_healthy }
    healthcheck: *svc_health_8080

  summarizer:
    build: { context: ../services, dockerfile: summarizer/Dockerfile }
    image: steakllm/summarizer:local
    profiles: ["services"]
    stop_grace_period: 30s
    volumes: *aws_creds
    env_file: ../.env
    environment: *svc_env
    depends_on:
      kafka: { condition: service_healthy }
      gateway: { condition: service_healthy }
    healthcheck: *svc_health_8080

  notifier:
    build: { context: ../services, dockerfile: notifier/Dockerfile }
    image: steakllm/notifier:local
    profiles: ["services"]
    stop_grace_period: 30s
    volumes: *aws_creds
    env_file: ../.env
    environment: *svc_env
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck: *svc_health_8080

volumes:
  minio-data:
  dynamodb-data:
  qdrant-data:
  kafka-data:
  ollama-models:
  open-webui-data:
